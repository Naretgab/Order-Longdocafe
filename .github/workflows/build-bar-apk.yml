name: Build Bar APK
on:
  workflow_dispatch: {}
  push:
    paths: ["bar-app/**", ".github/workflows/build-bar-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: bar-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx cap add android
      - name: Firebase config (google-services.json from secret)
        env: { GSJ: "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" }
        run: |
          test -n "$GSJ" || { echo "::error::ยังไม่ได้ตั้ง secret GOOGLE_SERVICES_JSON_B64"; exit 1; }
          echo "$GSJ" | base64 -d > android/app/google-services.json
      - name: Notification sound + app icon
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/alert.mp3 android/app/src/main/res/raw/alert.mp3
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              [ -f android/app/src/main/res/$d/$f ] && cp assets/icon.png android/app/src/main/res/$d/$f || true
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml || true
      - name: Android permissions (แจ้งเตือน)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />#' android/app/src/main/AndroidManifest.xml
          grep -c POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        working-directory: bar-app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LongDoBar-apk
          path: bar-app/android/app/build/outputs/apk/debug/app-debug.apk
