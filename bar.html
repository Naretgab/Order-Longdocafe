<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Long Do Bar — รับออเดอร์</title>
<link rel="manifest" href="bar.webmanifest">
<meta name="theme-color" content="#00b14f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Long Do Bar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="capacitor.js"></script>
<script src="native-bridge.js?v=2"></script>
<style>
:root{--g:#00b14f;--gd:#008f40;--bg:#f2f3f5;--card:#fff;--tx:#1f2328;--mut:#7a828c;--red:#e5484d;--org:#f59e0b;--blue:#2563eb;--bd:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Sarabun","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:#ffd0d0}
.dot.on{background:#b9ffd3;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
.tabs{position:sticky;top:52px;z-index:15;display:flex;background:#fff;border-bottom:1px solid var(--bd)}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:14px;border:0;background:none;color:var(--mut);border-bottom:3px solid transparent;font-weight:600}
.tab.act{color:var(--g);border-bottom-color:var(--g)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bd);color:var(--tx);font-size:12px;margin-left:4px}
.tab.new .n.has{background:var(--red);color:#fff}
main{padding:12px;max-width:760px;margin:0 auto}
.empty{text-align:center;color:var(--mut);padding:60px 0}
.card{background:var(--card);border-radius:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.card.fresh{animation:pulse 1.2s infinite;outline:2px solid var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(229,72,77,.25)}}
.ch{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}
.no{font-weight:800;font-size:18px}
.badge{font-size:12px;padding:3px 8px;border-radius:999px;color:#fff;font-weight:700}
.b-รับที่ร้าน{background:var(--blue)}.b-เดลิเวอรี่{background:var(--org)}
.meta{padding:10px 14px;font-size:14px;line-height:1.6;color:var(--mut)}
.meta b{color:var(--tx)}
.items{padding:0 14px 6px}
.it{padding:8px 0;border-top:1px dashed var(--bd);display:flex;gap:10px}
.it .q{font-weight:800;min-width:34px;color:var(--g)}
.it .nm{font-weight:700}
.it .op{font-size:13px;color:var(--mut)}
.it .nt{font-size:13px;color:var(--red)}
.cf{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--bd);align-items:center}
.cf .tot{flex:1;font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;color:#fff;background:var(--g)}
.btn.sec{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.big{background:var(--g)}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#login input{width:100%;padding:12px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;font-size:16px}
#login h2{margin:0 0 8px;color:var(--g)}
#err{color:var(--red);font-size:14px;min-height:20px}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center}
#popup.show{display:flex}
#popup div{background:#fff;border-radius:18px;padding:28px;text-align:center;max-width:320px}
#popup h2{margin:0 0 6px;color:var(--red)}
.tab .n.hold.has,.tab .n.hold{background:#f59e0b;color:#fff}
#editModal{position:fixed;inset:0;background:var(--bg);z-index:58;display:none;flex-direction:column}
#editModal.show{display:flex}
#editModal .sh{background:var(--g);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#editModal .sh h2{margin:0;font-size:18px;flex:1}
#editModal .sh button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
#editBody{flex:1;overflow:auto;padding:12px 12px 90px}
#editBody label{display:block;font-weight:700;font-size:13px;color:var(--mut);margin:12px 0 4px}
#editBody input,#editBody select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:#fff;font-family:inherit}
#editBody .eit{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px}
#editBody .eit .r{display:flex;gap:8px;align-items:flex-end}
#editBody .eit .r>div{flex:1}
#editBody .eit .r>div.q{flex:0 0 74px}
#editBody .eit .r>div.pz{flex:0 0 96px}
#editBody .opt{display:flex;gap:6px;margin-top:6px}
#editBody .opt input{flex:1}
#editBody .x{border:0;background:#fdecec;color:var(--red);border-radius:8px;padding:0 12px;font-size:18px;font-weight:800}
#editBody .add{margin-top:8px;border:1px dashed var(--g);background:#fff;color:var(--gd);border-radius:10px;padding:9px;font-weight:700;width:100%}
#editSaveBar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
#editSaveBar .btn{flex:1}
.hold-note{margin:0 14px 10px;padding:12px;border-radius:10px;background:#fff7e0;border:2px solid #f59e0b;color:#92400e;font-weight:800;font-size:16px}
.hold-note small{display:block;font-weight:600;font-size:13px;margin-top:2px}
.cnt{margin:0 14px 12px;padding:12px;border-radius:10px;background:#f3f4f6;font-weight:800;font-size:16px}
#printModal{position:fixed;inset:0;background:#fff;z-index:57;display:none;flex-direction:column}
#printModal.show{display:flex}
#printModal .sh{background:var(--g);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#printModal .sh h2{margin:0;font-size:18px;flex:1}
#printModal .sh button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
#printBody{flex:1;overflow:auto;padding:14px;font-size:15px;line-height:1.5}
#printBody label{display:block;font-weight:700;margin:14px 0 4px}
#printBody select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;font-size:16px}
#printBody .box{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg);font-size:14px;color:#374151}
#printBody .row{display:flex;gap:8px;margin-top:10px}
#printBody .row .btn{flex:1}
.warn{margin:0 14px 10px;padding:8px 10px;border-radius:10px;background:#fff4e5;color:#b45309;font-size:13px;font-weight:700}
.call{display:inline-block;margin:2px 0 0;padding:7px 12px;border-radius:10px;background:#e8f8ef;color:var(--gd);font-weight:800;font-size:15px;text-decoration:none}
#shopBar{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--bd)}
#shopBar button{flex:1;border:0;border-radius:10px;padding:10px 8px;font-size:14px;font-weight:800;color:#fff}
#shopToggle.open{background:var(--g)} #shopToggle.closed{background:var(--red)}
#soldBtn{background:#6b7280}
#teamModal{position:fixed;inset:0;background:#fff;z-index:56;display:none;flex-direction:column}
#teamModal.show{display:flex}
#teamModal .sh{background:var(--g);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#teamModal .sh h2{margin:0;font-size:18px;flex:1}
#teamModal .sh button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
#teamBody{flex:1;overflow:auto;padding:12px}
#teamBody h3{margin:16px 0 8px;font-size:15px;color:var(--gd)}
.pr{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#fff;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}
.pr .st{width:10px;height:10px;border-radius:50%;background:#c4c9d0;flex:none}
.pr.on .st{background:var(--g);box-shadow:0 0 0 3px rgba(0,177,79,.2)}
.pr .nm{flex:1;font-weight:700}
.pr .sub{font-size:13px;color:var(--mut);font-weight:400}
.pr .rm{border:0;background:#fdecec;color:var(--red);border-radius:8px;padding:6px 10px;font-weight:700}
.me{background:#f0faf4;border:1px dashed var(--g);border-radius:12px;padding:12px;font-size:14px}
.me select{width:100%;padding:10px;margin-top:6px;border:1px solid var(--bd);border-radius:8px;font-size:15px}
#soldModal{position:fixed;inset:0;background:#fff;z-index:55;display:none;flex-direction:column}
#soldModal.show{display:flex}
#soldModal .sh{background:var(--g);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#soldModal .sh h2{margin:0;font-size:18px;flex:1}
#soldModal .sh button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
#soldSearch{margin:10px 12px 0;padding:11px;border:1px solid var(--bd);border-radius:10px;font-size:16px}
#soldList{flex:1;overflow:auto;padding:8px 12px 30px}
.day{position:sticky;top:96px;z-index:5;display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--bg);padding:12px 2px 8px;font-weight:800}
.day small{font-weight:600;color:var(--mut);font-size:13px}
.sc{font-weight:800;margin:14px 0 4px;color:var(--gd)}
.sr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.sr .nm{flex:1;font-size:15px}
.sr.out .nm{color:var(--red);font-weight:700}
.sr input[type=time]{padding:6px;border:1px solid var(--bd);border-radius:8px;font-size:14px}
.sr .tg{border:0;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;color:#fff;background:var(--g);min-width:64px}
.sr.out .tg{background:var(--red)}
#snd{display:none;background:#fff3cd;padding:10px 16px;font-size:14px;text-align:center}
</style>
</head>
<body>
<div id="login" style="display:none">
  <h2>Long Do Bar</h2>
  <div style="color:var(--mut);font-size:14px">เข้าสู่ระบบสำหรับพนักงาน</div>
  <input id="em" type="text" placeholder="ชื่อผู้ใช้ (username)" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
  <input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
  <div id="err"></div>
  <button class="btn big" id="loginBtn" style="width:100%">เข้าสู่ระบบ</button>
</div>

<div id="app" style="display:none">
  <header>
    <span class="dot" id="dot" title="สถานะเชื่อมต่อ"></span>
    <h1>Long Do Bar</h1>
    <button id="teamBtn">👥 ทีม</button>
    <button id="lineBtn">📲 รับแจ้งเตือน LINE</button>
    <button id="muteBtn">🔔 เสียง: เปิด</button>
    <button id="outBtn">ออก</button>
  </header>
  <div id="snd" style="cursor:pointer;font-weight:700">🔇 เสียงยังไม่เปิด — แตะตรงนี้ 1 ครั้งเพื่อเปิดเสียงแจ้งเตือน</div>
  <div id="shopBar">
    <button id="shopToggle" class="open">🟢 เปิดรับออเดอร์</button>
    <button id="soldBtn">🍽 เมนูหมด</button>
    <button id="printBtn" style="background:#374151">🖨 เครื่องพิมพ์</button>
    <button id="pushBtn" style="background:#2563eb">🔔 เปิดแจ้งเตือน</button>
  </div>
  <div id="stationBar" style="display:none;padding:10px 14px;text-align:center;font-weight:700;font-size:14px;cursor:pointer"></div>
  <div class="tabs" id="tabs"></div>
  <main id="list"></main>
</div>

<div id="editModal">
  <div class="sh"><h2 id="editTitle">แก้ไขออเดอร์</h2><button id="editClose">ปิด</button></div>
  <div id="editBody"></div>
  <div id="editSaveBar"><button class="btn sec" id="editCancel" style="color:#374151;border-color:#9ca3af">ยกเลิก</button><button class="btn" id="editSave">💾 บันทึกการแก้ไข</button></div>
  <datalist id="menuNames"></datalist>
</div>
<div id="printModal">
  <div class="sh"><h2>เครื่องพิมพ์ใบออเดอร์</h2><button id="printClose">ปิด</button></div>
  <div id="printBody"></div>
</div>
<div id="teamModal">
  <div class="sh"><h2>ทีมงาน &amp; ลูกค้าล่าสุด</h2><button id="teamClose">ปิด</button></div>
  <div id="teamBody"></div>
</div>
<div id="soldModal">
  <div class="sh"><h2>จัดการเมนูหมด</h2><button id="soldClose">ปิด</button></div>
  <input id="soldSearch" type="search" placeholder="ค้นหาเมนู...">
  <div id="soldList"></div>
</div>
<div id="popup"><div><h2>🔔 มีออเดอร์ใหม่!</h2><p id="popTxt"></p><button class="btn big" id="popOk">รับทราบ</button></div></div>

function loadAlertSound(){
  try{
    const bin = atob(ALERT_B64), u8 = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
    const p = audioCtx.decodeAudioData(u8.buffer, b=>{ alertBuf = b; }, ()=>{});
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}

}

    /* สำรอง (ถ้าไฟล์เสียงถอดรหัสไม่ได้): ติ๊งไล่เสียงขึ้น + เสียงพูด "ลองดู" */
    [[784,0],[988,.11],[1319,.22],[1568,.33]].forEach(([f,d])=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + d;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.55, t + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t + .2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + .22);
    });
  }catch(e){}
  setTimeout(speakAlert, 520);
}
let thVoice = null;
function speakAlert(){
  try{
    if(muted || !window.speechSynthesis) return;
    const ss = window.speechSynthesis;
    if(!thVoice){ thVoice = ss.getVoices().find(v=>/^th/i.test(v.lang)) || null; }
    ss.cancel();
    const u = new SpeechSynthesisUtterance("ลองดู");
    u.lang = "th-TH"; if(thVoice) u.voice = thVoice;
    u.pitch = 1.7; u.rate = 1.25; u.volume = 1; /* สูง + เร็ว = เสียงตื่นเต้น */
    ss.speak(u);
  }catch(e){}
}

function phoneOf(t){
  const m = String(t || "").match(/0\d[\d\s-]{7,11}\d/);
  return m ? m[0].trim() : "";
}
function timeAgo(iso){
  const m = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/60000));
  if(m < 1) return "เมื่อสักครู่";
  if(m < 60) return m + " นาทีที่แล้ว";
  return new Date(iso).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}) + " น.";
}
function daysAgoStart(n){ const d = new Date(); d.setDate(d.getDate()-n); d.setHours(0,0,0,0); return d.getTime(); }
function dayKey(iso){ const d = new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayLabel(key){
  const t = dayKey(new Date().toISOString());
  const y = new Date(); y.setDate(y.getDate()-1);
  if(key === t) return "วันนี้";
  if(key === dayKey(y.toISOString())) return "เมื่อวาน";
  const [Y,M,D] = key.split("-").map(Number);
  return new Date(Y,M-1,D).toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
}
function todayStart(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function visible(o){
  if(curTab === "done") return (o.status==="done"||o.status==="cancelled") && new Date(o.created_at).getTime() >= daysAgoStart(30);
  return normStatus(o.status) === curTab;
}

function toast(msg){
  let t = $("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;max-width:90vw;text-align:center;font-size:14px";
    document.body.appendChild(t); }
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.style.display = "none", 4000);
}
async function finishOrder(id, notify){
  const o = orders.get(id); if(!o) return;
  if(notify && !o.line_user_id){
    if(!confirm("ออเดอร์นี้ไม่มีข้อมูล LINE ของลูกค้า จึงแจ้งอัตโนมัติไม่ได้\nต้องการกดเสร็จ (ไม่แจ้ง) แทนหรือไม่?")) return;
    notify = false;
  }
  await setStatus(id, "done");
  if(!notify || orders.get(id).status !== "done") return;
  const { data, error } = await sb.functions.invoke("swift-endpoint", { body: { order_id: id } });
  let detail = (data && data.error) || "";
  if(error && !detail){
    detail = error.message || "unknown";
    try{ // ฟังก์ชันตอบ non-2xx: อ่านเนื้อหาจริงที่ฟังก์ชันส่งกลับ
      if(error.context && error.context.json){ const j = await error.context.json(); detail = (j && (j.error || j.message)) || detail; }
      else if(error.context && error.context.status){ detail += " (HTTP " + error.context.status + ")"; }
    }catch(e){}
    if(/Failed to send a request/i.test(detail)) detail += " — ฟังก์ชันอาจยังไม่ได้ deploy หรือชื่อไม่ใช่ notify-line";
  }
  if(detail){
    console.error("notify-line failed:", error, data);
    toast("เสร็จแล้ว แต่ส่งข้อความหาลูกค้าไม่สำเร็จ: " + detail);
    alert("แจ้งลูกค้าไม่สำเร็จ\n" + detail);
  }else{
    o.notified_at = new Date().toISOString(); render();
    toast("ส่งข้อความแจ้งลูกค้าแล้ว ✓");
  }
}
async function setStatus(id, status){
  const o = orders.get(id); if(!o) return;
  const prev = o.status;
  o.status = status; fresh.delete(id); render(); updateAlarm();
  const { error } = await sb.from("orders").update({status, updated_at:new Date().toISOString()}).eq("id", id);
  if(error){
    o.status = prev; render(); updateAlarm();
    alert("บันทึกไม่สำเร็จ: " + error.message + (/check constraint|status/i.test(error.message) ? "\n(ให้รัน migration_summarized_flow.sql ก่อน)" : ""));
    return false;
  }
  return true;
}
// กด "สรุปแล้ว → ออเดอร์ใหม่": ย้ายไปหน้าออเดอร์ใหม่ และพิมพ์ใบออเดอร์อัตโนมัติ (ถ้าเปิดไว้)
async function summarizeOrder(id){
  const ok = await setStatus(id, "summarized");
  if(!ok) return;
  const cfg = getPrintCfg();
  if(cfg.mode !== "off" && cfg.auto) printOrder(orders.get(id), false);
}

/* ---------- data ---------- */
function upsertOrder(o, announce){
  const isNew = !orders.has(o.id);
  orders.set(o.id, o);
  if(isNew && o.status === "new" && announce){
    fresh.add(o.id);
    $("popTxt").textContent = `#${o.order_no} · ${o.customer_name}`;
    $("popup").classList.add("show");
    ensureAudio();
  }
}
let fullLoaded = false;
async function loadOrders(announce){
  const since = new Date(daysAgoStart(fullLoaded ? 1 : 30)); // ครั้งแรกโหลดย้อนหลัง 30 วัน รอบถัดไปโหลดเฉพาะล่าสุด
  const { data, error } = await sb.from("orders").select("*")
    .or(`status.in.(new,pending_summary,summarized,preparing,ready),created_at.gte.${since.toISOString()}`)
    .order("created_at",{ascending:true}).limit(2000);
  if(error){ $("dot").classList.remove("on"); return; }
  fullLoaded = true;
  const ids = new Set(data.map(o=>o.id));
  data.forEach(o=> upsertOrder(o, announce));
  for(const id of [...orders.keys()]) if(!ids.has(id) && orders.get(id).status==="new") orders.delete(id);
  render(); updateAlarm();
}
function startRealtime(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("orders-bar")
    .on("postgres_changes",{event:"*",schema:"public",table:"orders"}, p=>{
      if(p.eventType === "DELETE"){ orders.delete(p.old.id); }
      else upsertOrder(p.new, true);
      render(); updateAlarm();
    })
    .subscribe(st=>{
      $("dot").classList.toggle("on", st === "SUBSCRIBED");
      if(st === "SUBSCRIBED") loadOrders(true);
    });
  clearInterval(pollTimer);
  pollTimer = setInterval(()=> loadOrders(true), 15000); // สำรองกรณี realtime หลุด
  setInterval(render, 60000);
}

function closeEdit(){ $("editModal").classList.remove("show"); draft = null; }
$("editClose").onclick = $("editCancel").onclick = ()=>{ if(!draft || confirm("ปิดโดยไม่บันทึกการแก้ไข?")) closeEdit(); };
$("editSave").onclick = async ()=>{
  readEdit();
  const d = draft, items = d.items.map(it=>({ name:it.name.trim(), qty:Math.round(it.qty), unitPrice:it.unitPrice, opts:it.opts.map(x=>x.trim()).filter(Boolean), note:it.note.trim() }));
  if(!items.length){ alert("ต้องมีสินค้าอย่างน้อย 1 รายการ"); return; }
  if(items.some(it=> !it.name || it.qty < 1)){ alert("ทุกรายการต้องมีชื่อสินค้าและจำนวนอย่างน้อย 1"); return; }
  const total = totalTouched ? d.total : calcTotal(items);
  const patch = { customer_name:d.customer_name.trim() || "ลูกค้า", order_type:d.order_type, time_text:d.time_text.trim() || "ทันที",
                  address:d.address.trim(), note:d.note.trim(), items, total, updated_at:new Date().toISOString() };
  $("editSave").disabled = true;
  const { error } = await sb.from("orders").update(patch).eq("id", d.id);
  $("editSave").disabled = false;
  if(error){ alert("บันทึกไม่สำเร็จ: " + error.message); return; }
  Object.assign(orders.get(d.id), patch);
  closeEdit(); render(); toast("บันทึกการแก้ไขออเดอร์แล้ว ✓");
};

/* ชื่อเมนูภาษาอังกฤษ: "มัทฉะลาเต้ (Matcha Latte)" → "Matcha Latte" (ถ้าไม่มีวงเล็บใช้ชื่อเดิม) */
const engName = n => { const m = String(n || "").match(/\(([^()]*[A-Za-z][^()]*)\)\s*$/); return m ? m[1].trim() : String(n || ""); };
const imgOk = i => !!(i && i.complete && i.naturalWidth);

// วาดใบออเดอร์เป็นภาพ หน้าตาเหมือนบิล POS (รองรับภาษาไทยทุกรุ่นเครื่องพิมพ์ ไม่ต้องตั้ง code page)
function ticketCanvas(o, width, scale){
  const FONT = '"Sarabun","Noto Sans Thai","Tahoma",sans-serif';
  const items = Array.isArray(o.items) ? o.items : [];
  const d = new Date(o.created_at || Date.now());
  const baht = n => "฿" + Number(n || 0).toLocaleString("th-TH");
  const pad = 6, maxW = width - pad*2;
  const meas = document.createElement("canvas").getContext("2d");
  const font = (l)=> (l.b ? "bold " : "") + l.sz + "px " + FONT;
  const lh = l => Math.round(l.sz * 1.35);
  const P = []; // รายการคำสั่งวาด
  const text = (t, b, sz, al, extra)=> P.push(Object.assign({ k:"text", t:String(t == null ? "" : t), b:!!b, sz:sz||22, al:al||"left" }, extra||{}));
  const row = (l, r, b, sz)=> P.push({ k:"row", l:String(l), r:String(r), b:!!b, sz:sz||22 });
  const dash = ()=> P.push({ k:"dash" });
  const gap = h => P.push({ k:"gap", h });
  const wrap = (t, l, w)=>{
    meas.font = font(l); const out = []; let cur = "";
    for(const ch of Array.from(t)){
      if(meas.measureText(cur + ch).width > w && cur){
        const sp = cur.lastIndexOf(" ");
        if(sp > 0 && ch !== " "){ out.push(cur.slice(0, sp)); cur = cur.slice(sp + 1) + ch; }
        else{ out.push(cur); cur = ch === " " ? "" : ch; }
      } else cur += ch;
    }
    out.push(cur); return out;
  };

  if(imgOk(logoImg)) P.push({ k:"img", img:logoImg, w:Math.min(150, width - 40) });
  text(SHOP.name, false, 26, "center");
  if(SHOP.address) text(SHOP.address, false, 20, "center");
  if(SHOP.phone) text("โทร: " + SHOP.phone, false, 20, "center");
  gap(4);
  text("ออเดอร์ #" + o.order_no, false, 48, "center");
  text("ลูกค้า: " + (o.customer_name || ""), false, 28, "center");
  text(d.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"}) + " " + d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}) + " น.", false, 22, "center");
  dash();
  text((o.order_type || "") + " · " + (o.time_text || ""), false, 26);
  if(o.address) text("ที่อยู่: " + o.address, false, 24);
  if(o.note) text("หมายเหตุ/เบอร์: " + o.note, false, 26);
  dash();
  items.forEach(it=>{
    const qty = Number(it.qty) || 1, unit = Number(it.unitPrice) || 0;
    row(engName(it.name) + " x" + qty, baht(unit * qty), true, 26)   /* ชื่อเมนูเป็นภาษาอังกฤษ + ตัวหนาเฉพาะชื่อเมนู */;
    if(qty > 1 && unit) text("   · " + baht(unit) + "/ชิ้น", false, 20);
    const opts = (it.opts || []).filter(Boolean);
    if(opts.length) text("› " + opts.join(", "), false, 22, "left", { indent:12 });
    if(it.note) text("* " + it.note, false, 22, "left", { indent:12 });
  });
  dash();
  row("รวม", baht(o.total), false, 24);
  row("ยอดรวม", baht(o.total), false, 34);
  if(imgOk(qrImg)){ gap(6); text("สแกน QR ชำระเงิน", false, 20, "center"); P.push({ k:"img", img:qrImg, w:width - 24 }); }
  dash();
  if(SHOP.footer) text(SHOP.footer, false, 22, "center");
  gap(16);

  // วัดความสูง (ตัดบรรทัดตามความกว้าง)
  const draw = [];
  P.forEach(p=>{
    if(p.k === "text"){
      const w = maxW - (p.indent || 0);
      wrap(p.t, p, w).forEach(t=> draw.push(Object.assign({}, p, { t, h:lh(p) })));
    } else if(p.k === "row"){
      const rw = (meas.font = font(p), meas.measureText(p.r).width);
      const lines = wrap(p.l, p, maxW - rw - 10);
      lines.forEach((t,i)=> draw.push({ k:"row", l:t, r:i === lines.length - 1 ? p.r : "", b:p.b, sz:p.sz, h:lh(p) }));
    } else if(p.k === "img"){ const h = Math.round(p.img.naturalHeight * p.w / p.img.naturalWidth); draw.push({ k:"img", img:p.img, w:p.w, ih:h, h:h + 8 }); }
    else if(p.k === "dash") draw.push({ k:"dash", h:14 });
    else draw.push({ k:"gap", h:p.h });
  });
  const H = draw.reduce((t,p)=> t + p.h, 0) + 24;
  const sc = scale || 1;
  const c = document.createElement("canvas"); c.width = Math.round(width * sc); c.height = Math.round(H * sc);
  const g = c.getContext("2d");
  g.scale(sc, sc);
  g.fillStyle = "#fff"; g.fillRect(0, 0, width, H);
  g.fillStyle = "#000"; g.strokeStyle = "#000"; g.textBaseline = "top";
  let y = 12;
  draw.forEach(p=>{
    if(p.k === "text"){
      g.font = font(p);
      const w = g.measureText(p.t).width;
      const x = p.al === "center" ? (width - w)/2 : p.al === "right" ? width - pad - w : pad + (p.indent || 0);
      if(p.inv){ g.fillStyle = "#000"; g.fillRect(0, y - 8, width, p.h + 12); g.fillStyle = "#fff"; }
      g.fillText(p.t, x, y);
      if(p.inv) g.fillStyle = "#000";
    } else if(p.k === "row"){
      g.font = font(p); g.fillText(p.l, pad, y);
      if(p.r) g.fillText(p.r, width - pad - g.measureText(p.r).width, y);
    } else if(p.k === "img"){ g.drawImage(p.img, (width - p.w)/2, y + 4, p.w, p.ih); }
    else if(p.k === "dash"){ g.lineWidth = 2; g.setLineDash([8, 6]); g.beginPath(); g.moveTo(pad, y + 6); g.lineTo(width - pad, y + 6); g.stroke(); g.setLineDash([]); }
    y += p.h;
  });
  return c;
}
// แปลงภาพเป็นคำสั่ง ESC/POS แบบ raster (GS v 0) แบ่งเป็นแถบเพื่อกันเครื่องพิมพ์บัฟเฟอร์เต็ม
function canvasToEscpos(c){
  const w = c.width, h = c.height, bpr = w >> 3;
  const px = c.getContext("2d").getImageData(0, 0, w, h).data;
  const out = [0x1b, 0x40];
  const BAND = 128;
  for(let y0 = 0; y0 < h; y0 += BAND){
    const rows = Math.min(BAND, h - y0);
    out.push(0x1d, 0x76, 0x30, 0x00, bpr & 255, bpr >> 8, rows & 255, rows >> 8);
    for(let y = y0; y < y0 + rows; y++){
      for(let bx = 0; bx < bpr; bx++){
        let byte = 0;
        for(let bit = 0; bit < 8; bit++){
          const i = (y*w + bx*8 + bit) * 4;
          const lum = px[i]*0.299 + px[i+1]*0.587 + px[i+2]*0.114;
          if(lum < 150 && px[i+3] > 0) byte |= (0x80 >> bit);
        }
        out.push(byte);
      }
    }
  }
  out.push(0x1b, 0x64, 0x05, 0x1d, 0x56, 0x42, 0x00); // ฟีดกระดาษ + ตัด (ถ้ามีใบมีด)
  return Uint8Array.from(out);
}
/* ---------- บิลเป็นรูป PNG: ดูตัวอย่าง / แชร์ / ดาวน์โหลด ---------- */

function ticketBytes(o, width){ return canvasToEscpos(ticketCanvas(o, width)); }
function toB64(bytes){
  let s = "";
  for(let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(s);
}

// Bluetooth (Web Bluetooth: Chrome/Edge บน Android และคอมพิวเตอร์ — เครื่องพิมพ์ต้องเป็นแบบ BLE)
const BT_SERVICES = [
  "000018f0-0000-1000-8000-00805f9b34fb", "0000ff00-0000-1000-8000-00805f9b34fb",
  "0000ffe0-0000-1000-8000-00805f9b34fb", "e7810a71-73ae-499d-8c15-faa9aef0c3f2",
  "49535343-fe7d-4ae5-8fa9-9fafd205e455", "0000fee7-0000-1000-8000-00805f9b34fb"
];
let btDev = null, btChar = null;
async function btFindChar(){
  const server = btDev.gatt.connected ? btDev.gatt : await btDev.gatt.connect();
  const services = await server.getPrimaryServices();
  for(const sv of services){
    const chars = await sv.getCharacteristics();
    const c = chars.find(x=> x.properties.writeWithoutResponse || x.properties.write);
    if(c){ btChar = c; return; }
  }
  throw new Error("ไม่พบช่องส่งข้อมูลของเครื่องพิมพ์ (ถ้าเป็นบลูทูธแบบคลาสสิก เว็บเชื่อมตรงไม่ได้ ให้ใช้แบบ LAN แทน)");
}
async function btConnect(){
  if(!navigator.bluetooth) throw new Error("เบราว์เซอร์นี้ไม่รองรับ Web Bluetooth (ใช้ Chrome บน Android/คอมพิวเตอร์ หรือแอป Bluefy บน iPhone)");
  btDev = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:BT_SERVICES });
  btDev.addEventListener("gattserverdisconnected", ()=>{ btChar = null; renderStationBar(); });
  try{ localStorage.setItem("bar_bt_name", btDev.name || ""); }catch(e){}
  await btFindChar();
}
function btReady(){ return !!(btDev && btDev.gatt && btDev.gatt.connected && btChar); }
// เชื่อมใหม่เงียบๆ กับเครื่องพิมพ์ที่เคยอนุญาตไว้ (ไม่ต้องกดซ้ำ ถ้าเบราว์เซอร์รองรับ getDevices)
async function btTryReconnect(){
  try{
    if(!btDev && navigator.bluetooth && navigator.bluetooth.getDevices){
      const devs = await navigator.bluetooth.getDevices();
      let saved = ""; try{ saved = localStorage.getItem("bar_bt_name") || ""; }catch(e){}
      btDev = devs.find(d=> d.name === saved) || devs[0] || null;
      if(btDev) btDev.addEventListener("gattserverdisconnected", ()=>{ btChar = null; renderStationBar(); });
    }
    if(btDev) await btFindChar();
  }catch(e){ btChar = null; }
}
async function btSend(bytes){
  if(!btDev) throw new Error("ยังไม่ได้เชื่อมต่อเครื่องพิมพ์บลูทูธ (กดปุ่ม 🖨 เครื่องพิมพ์ → เชื่อมต่อ)");
  if(!btChar) await btFindChar();
  const CH = 160;
  for(let i = 0; i < bytes.length; i += CH){
    const part = bytes.slice(i, i + CH);
    if(btChar.properties.writeWithoutResponse) await btChar.writeValueWithoutResponse(part);
    else await btChar.writeValue(part);
    await wait(12);
  }
}

function slimOrder(o){
  return { order_no:o.order_no, created_at:o.created_at, order_type:o.order_type, time_text:o.time_text, customer_name:o.customer_name,
           address:o.address || "", note:o.note || "", total:o.total, items:o.items };
}
function b64ToBytes(b64){ const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

// ทุกเครื่องสั่งพิมพ์ด้วยการ "ส่งคิว" เสมอ — เครื่องประจำร้าน (หรือ print-agent) จะรับคิวไปพิมพ์เอง
async function printOrder(o, manual){
  if(!o) return false;

  if(cfg.mode === "off"){ if(manual) toast("ยังไม่ได้ตั้งค่าเครื่องพิมพ์ (กดปุ่ม 🖨 เครื่องพิมพ์)"); return false; }
  try{
    const { error } = await sb.from("print_jobs").insert({ order_id:o.id, order_data:slimOrder(o), payload:toB64(ticketBytes(o, cfg.width)) });
    if(error) throw error;
    toast("ส่งคิวพิมพ์ออเดอร์ #" + o.order_no + " แล้ว 🖨");

    return false;
  }
}

/* ----- เครื่องประจำร้าน: รับคิวพิมพ์ทั้งหมดแล้วพิมพ์ผ่าน Bluetooth ----- */
let stationBusy = false, stationStarted = false;
function stationOn(){ return getPrintCfg().mode === "station" && $("app").style.display !== "none"; }
async function pendingCount(){
  const r = await sb.from("print_jobs").select("id", { count:"exact", head:true }).eq("status", "pending");
  return r.error ? null : (r.count || 0);
}
async function renderStationBar(){
  const el = $("stationBar"); if(!el) return;
  if(!stationOn()){ el.style.display = "none"; return; }
  const ok = btReady();
  const n = await pendingCount();
  el.style.display = "block";
  el.style.background = ok ? "#e8f8ef" : "#fff4e5";
  el.style.color = ok ? "#047857" : "#b45309";
  el.innerHTML = ok
    ? `🖨 เครื่องพิมพ์ประจำร้าน: เชื่อมต่อ ${esc(btDev.name||"")} แล้ว ✅${n ? ` · รอพิมพ์ ${n}` : ""}`
    : `⚠️ เครื่องพิมพ์ยังไม่เชื่อมต่อ${n ? ` (มีงานรอพิมพ์ ${n})` : ""} — <u>แตะเพื่อเชื่อมต่อ</u>`;
  el.onclick = ok ? null : async ()=>{
    try{ await btConnect(); toast("เชื่อมต่อเครื่องพิมพ์แล้ว ✅"); }catch(e){ if(e && e.name !== "NotFoundError") alert("เชื่อมต่อไม่สำเร็จ: " + (e.message || e)); }
    runStation();
  };
}
async function runStation(){
  if(stationBusy || !stationOn()) return;
  stationBusy = true;
  try{
    if(!btReady()) await btTryReconnect();
    if(btReady()){
      const { data, error } = await sb.from("print_jobs").select("id,order_data,payload").eq("status", "pending").order("created_at", { ascending:true }).limit(10);
      if(!error) for(const j of data || []){
        const { data: claimed } = await sb.from("print_jobs").update({ status:"printing" }).eq("id", j.id).eq("status", "pending").select("id");
        if(!claimed || !claimed.length) continue; // มีเครื่องอื่นรับไปแล้ว
        try{
          const bytes = j.order_data ? ticketBytes(j.order_data, getPrintCfg().width) : b64ToBytes(j.payload);
          await btSend(bytes);
          await sb.from("print_jobs").update({ status:"printed", printed_at:new Date().toISOString(), error:null }).eq("id", j.id);
          toast("พิมพ์ออเดอร์ #" + ((j.order_data && j.order_data.order_no) || "") + " แล้ว 🖨");
          await wait(1200); // เว้นให้เครื่องพิมพ์ตัดกระดาษ/เคลียร์บัฟเฟอร์ก่อนใบถัดไป
        }catch(e){
          await sb.from("print_jobs").update({ status:"error", error:String(e && e.message || e).slice(0, 300) }).eq("id", j.id);
          toast("พิมพ์ไม่สำเร็จ: " + (e && e.message || e));
          btChar = null;
          break;
        }
      }
    }
  }catch(e){ console.error("station:", e); }
  finally{ stationBusy = false; renderStationBar(); }
}
function startStation(){
  if(stationStarted){ runStation(); return; }
  stationStarted = true;
  // งานที่ค้าง "printing" เกิน 2 นาที (เช่นแอปถูกปิดกลางคัน) กลับไปรอพิมพ์ใหม่
  if(getPrintCfg().mode === "station") sb.from("print_jobs").update({ status:"pending" }).eq("status", "printing").lt("created_at", new Date(Date.now() - 120000).toISOString()).then(()=>{}, ()=>{});
  sb.channel("print-jobs-station").on("postgres_changes", { event:"INSERT", schema:"public", table:"print_jobs" }, ()=> runStation()).subscribe();
  setInterval(runStation, 4000); // สำรองกรณี realtime หลุด และใช้เชื่อมเครื่องพิมพ์ใหม่อัตโนมัติ
  runStation();
}

function ago(iso){
  if(!iso) return "ยังไม่เคยเปิดแอป";
  const m = Math.floor((Date.now() - new Date(iso).getTime())/60000);
  if(m < 1) return "เมื่อสักครู่";
  if(m < 60) return m + " นาทีที่แล้ว";
  const d = new Date(iso);
  const hm = d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}) + " น.";
  if(dayKey(iso) === dayKey(new Date().toISOString())) return "วันนี้ " + hm;
  return d.toLocaleDateString("th-TH",{day:"numeric",month:"short"}) + " " + hm;
}

/* ---------- จัดการเมนูหมด ---------- */
let soldMap = {};   // item_id -> {until}
let menuRows = [];
function isOutNow(e){
  if(!e) return false;
  if(!e.until) return true;
  const [h,m] = e.until.split(":").map(Number);
  const d = new Date(); d.setHours(h,m,0,0);
  return new Date() < d;
}
async function openSold(){
  $("soldModal").classList.add("show");
  $("soldList").innerHTML = '<div class="empty">กำลังโหลด...</div>';
  const [m, so] = await Promise.all([
    sb.from("menu_items").select("id,name,category,subcategory,category_order,subcategory_order,sort_order"),
    sb.from("sold_out_items").select("*")
  ]);
  if(m.error || so.error){ $("soldList").innerHTML = '<div class="empty">โหลดไม่สำเร็จ: ' + esc((m.error||so.error).message) + '</div>'; return; }
  menuRows = m.data.sort((a,b)=>(a.category_order||0)-(b.category_order||0) || (a.subcategory_order||0)-(b.subcategory_order||0) || (a.sort_order||0)-(b.sort_order||0));
  soldMap = {}; so.data.forEach(r=> soldMap[r.item_id] = r.until ? { until: r.until } : {});
  renderSold();
}
function renderSold(){
  const q = $("soldSearch").value.trim().toLowerCase();
  let html = "", lastCat = "";
  menuRows.forEach(r=>{
    if(q && !String(r.name).toLowerCase().includes(q)) return;
    const cat = r.category + (r.subcategory ? " › " + r.subcategory : "");
    if(cat !== lastCat){ html += `<div class="sc">${esc(cat)}</div>`; lastCat = cat; }
    const e = soldMap[r.id], out = !!e;
    html += `<div class="sr ${out?"out":""}" data-id="${esc(r.id)}">
      <div class="nm">${esc(r.name)}</div>
      ${out ? `<input type="time" value="${esc(e.until||"")}" title="เวลากลับมาขาย (เว้นว่าง = หมดจนกว่าจะปิด)">` : ""}
      <button class="tg" type="button">${out ? "หมดอยู่" : "ปกติ"}</button></div>`;
  });
  $("soldList").innerHTML = html || '<div class="empty">ไม่พบเมนู</div>';
  document.querySelectorAll("#soldList .sr").forEach(row=>{
    const id = row.dataset.id;
    row.querySelector(".tg").onclick = ()=> setSold(id, !soldMap[id], "");
    const t = row.querySelector('input[type=time]');
    if(t) t.onchange = ()=> setSold(id, true, t.value);
  });
}
async function setSold(id, out, until){
  const prev = soldMap[id];
  if(out) soldMap[id] = until ? { until } : {}; else delete soldMap[id];
  renderSold();
  const res = out
    ? await sb.from("sold_out_items").upsert({ item_id:id, until: until || null, updated_at:new Date().toISOString() })
    : await sb.from("sold_out_items").delete().eq("item_id", id);
  if(res.error){
    if(prev) soldMap[id] = prev; else delete soldMap[id];
    renderSold(); alert("บันทึกไม่สำเร็จ: " + res.error.message);
  }
}
$("soldBtn").onclick = openSold;
$("soldClose").onclick = ()=> $("soldModal").classList.remove("show");
$("soldSearch").oninput = renderSold;

async function registerLine(auto){
  try{
    if(!auto && isStandalone()){
      let inClient = false;
      try{ await loadLiff(); inClient = liff.isInClient(); }catch(e){}
      if(!inClient){ showLineHelp(); return; }
    }
    await loadLiff();
    if(!liff.isLoggedIn()){
      if(auto) return;
      try{ localStorage.setItem("bar_want_line","1"); }catch(e){}
      liff.login({ redirectUri: location.href.split("#")[0].split("?")[0] });
      return;
    }
    const p = await liff.getProfile();
    const { error } = await sb.from("staff_line").upsert({ user_id: p.userId, display_name: p.displayName });
    if(error) throw error;
    try{ localStorage.removeItem("bar_want_line"); localStorage.setItem("bar_line_ok","1"); }catch(e){}
    setMyStaffId(p.userId);

  }catch(e){
    if(!auto) alert("ลงทะเบียน LINE ไม่สำเร็จ: " + (e && e.message || e));
  }

function autoLine(){
  try{ if(/[?&]register=1/.test(location.search)) localStorage.setItem("bar_want_line","1"); }catch(e){}

  try{ want = localStorage.getItem("bar_want_line")==="1"; ok = localStorage.getItem("bar_line_ok")==="1"; }catch(e){}
  if(want || ok) registerLine(true);
}

      const permission = await Notification.requestPermission();
      if(permission !== "granted") throw new Error("ยังไม่ได้อนุญาตการแจ้งเตือน กรุณาเปิดในการตั้งค่า iPhone");
    }else if(Notification.permission !== "granted"){
      btn.textContent = "🔔 เปิดแจ้งเตือน";
      return;
    }
    if(!await firebase.messaging.isSupported()) throw new Error("Firebase Push ไม่รองรับบนเบราว์เซอร์นี้");
    const registration = await navigator.serviceWorker.ready;
    const messaging = initWebMessaging();
    const token = await messaging.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: registration });
    if(!token) throw new Error("ยังสร้าง Push Token ไม่สำเร็จ");
    const { data:userData, error:userError } = await sb.auth.getUser();
    if(userError || !userData?.user?.id) throw new Error("กรุณาเข้าสู่ระบบใหม่");
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const { error } = await sb.from("staff_devices").upsert({
      token, user_id:userData.user.id, platform:isIOS ? "ios-web" : "web", device_label:isIOS ? "iPhone / iPad (PWA)" : (/Android/i.test(navigator.userAgent) ? "Android (Web)" : "Web Browser"), updated_at:new Date().toISOString(), last_seen_at:new Date().toISOString(), is_active:true, last_error:null
    }, { onConflict:"token" });
    if(error) throw error;
    btn.textContent = "✓ เปิดแจ้งเตือนแล้ว";
    if(fromTap) toast("เปิดรับแจ้งเตือนออเดอร์แล้ว");
  }catch(e){
    btn.textContent = "🔔 เปิดแจ้งเตือน";
    if(fromTap) alert("เปิดแจ้งเตือนไม่สำเร็จ: " + (e?.message || e));
    else console.warn("Web Push registration:", e?.message || e);
  }
}
$("pushBtn").onclick = async ()=>{
  const btn = $("pushBtn");
  btn.textContent = "⏳ กำลังเริ่ม...";
  if(window.nativePush){
    const result = await window.nativePush.init(sb);
    btn.textContent = result === "ok" ? "✓ เปิดแจ้งเตือนแล้ว" : "🔔 เปิดแจ้งเตือน";
    if(result !== "ok") alert("ตั้งค่าแจ้งเตือน Android ไม่สำเร็จ: " + result + "\nกรุณาตรวจสิทธิ์แจ้งเตือนและ Google Services ของแอป");
  }else{
    await registerWebPush(true);
  }
};

/* ---------- PWA: service worker + กันจอดับ ---------- */
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
let wakeLock = null;
async function keepAwake(){
  try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible" && $("app").style.display !== "none") keepAwake(); });

/* ---------- auth ---------- */
function showApp(){
  $("login").style.display = "none"; $("app").style.display = "block";
  loadOrders(false).then(startRealtime);
  loadShop();
  sb.channel("shop-bar").on("postgres_changes",{event:"*",schema:"public",table:"shop_settings"}, loadShop).subscribe();
  keepAwake();
  if(window.nativePush) window.nativePush.init(sb); /* APK Android: ลงทะเบียน FCM Native */
  else registerWebPush(false); /* PWA: ต่อทะเบียน Web Push หากเคยอนุญาตแล้ว */
  startStation();
  autoLine();
  askWho();
  heartbeat();
}
function showLogin(){
  $("app").style.display = "none"; $("login").style.display = "block";
  clearInterval(pollTimer); clearInterval(alarmTimer); alarmTimer = null;
}
const EMAIL_DOMAIN = "@longdocafe.com"; // Supabase ต้องใช้รูปแบบอีเมล: username "bar" => bar@longdocafe.com
const COOKIE_DAYS = 90;
function setCookie(n,v,days){ document.cookie = `${n}=${encodeURIComponent(v)}; max-age=${days*86400}; path=/; SameSite=Lax`; }
function getCookie(n){ const m = document.cookie.split("; ").find(x=>x.startsWith(n+"=")); return m ? decodeURIComponent(m.slice(n.length+1)) : ""; }
function delCookie(n){ document.cookie = `${n}=; max-age=0; path=/`; }
$("loginBtn").onclick = async ()=>{
  $("err").textContent = "";
  const u = $("em").value.trim().toLowerCase();
  if(!u){ $("err").textContent = "กรุณากรอกชื่อผู้ใช้"; return; }
  const email = u.includes("@") ? u : u + EMAIL_DOMAIN;
  const { error } = await sb.auth.signInWithPassword({email, password:$("pw").value});
  if(error){ $("err").textContent = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"; return; }
  setCookie("bar_username", u, COOKIE_DAYS);
  setCookie("bar_login", "1", COOKIE_DAYS); // หมดอายุ 90 วัน => ต้องล็อกอินใหม่
  ensureAudio(); showApp();
};
$("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") $("loginBtn").click(); });
$("outBtn").onclick = async ()=>{ delCookie("bar_login"); await sb.auth.signOut(); orders.clear(); showLogin(); };
(async ()=>{
  $("em").value = getCookie("bar_username");
  const { data } = await sb.auth.getSession();
  if(data && data.session && getCookie("bar_login") === "1") showApp();
  else { if(data && data.session) await sb.auth.signOut(); showLogin(); }
})();
</script>
