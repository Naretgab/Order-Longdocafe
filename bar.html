<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Long Do Bar — รับออเดอร์</title>
<link rel="manifest" href="bar.webmanifest">
<meta name="theme-color" content="#00b14f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Long Do Bar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--g:#00b14f;--gd:#008f40;--bg:#f2f3f5;--card:#fff;--tx:#1f2328;--mut:#7a828c;--red:#e5484d;--org:#f59e0b;--blue:#2563eb;--bd:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Sarabun","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:#ffd0d0}
.dot.on{background:#b9ffd3;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
.tabs{position:sticky;top:52px;z-index:15;display:flex;background:#fff;border-bottom:1px solid var(--bd)}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:14px;border:0;background:none;color:var(--mut);border-bottom:3px solid transparent;font-weight:600}
.tab.act{color:var(--g);border-bottom-color:var(--g)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bd);color:var(--tx);font-size:12px;margin-left:4px}
.tab.new .n.has{background:var(--red);color:#fff}
main{padding:12px;max-width:760px;margin:0 auto}
.empty{text-align:center;color:var(--mut);padding:60px 0}
.card{background:var(--card);border-radius:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.card.fresh{animation:pulse 1.2s infinite;outline:2px solid var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(229,72,77,.25)}}
.ch{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}
.no{font-weight:800;font-size:18px}
.badge{font-size:12px;padding:3px 8px;border-radius:999px;color:#fff;font-weight:700}
.b-รับที่ร้าน{background:var(--blue)}.b-เดลิเวอรี่{background:var(--org)}
.meta{padding:10px 14px;font-size:14px;line-height:1.6;color:var(--mut)}
.meta b{color:var(--tx)}
.items{padding:0 14px 6px}
.it{padding:8px 0;border-top:1px dashed var(--bd);display:flex;gap:10px}
.it .q{font-weight:800;min-width:34px;color:var(--g)}
.it .nm{font-weight:700}
.it .op{font-size:13px;color:var(--mut)}
.it .nt{font-size:13px;color:var(--red)}
.cf{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--bd);align-items:center}
.cf .tot{flex:1;font-weight:700}
.btn{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;color:#fff;background:var(--g)}
.btn.sec{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.big{background:var(--g)}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#login input{width:100%;padding:12px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;font-size:16px}
#login h2{margin:0 0 8px;color:var(--g)}
#err{color:var(--red);font-size:14px;min-height:20px}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center}
#popup.show{display:flex}
#popup div{background:#fff;border-radius:18px;padding:28px;text-align:center;max-width:320px}
#popup h2{margin:0 0 6px;color:var(--red)}
.warn{margin:0 14px 10px;padding:8px 10px;border-radius:10px;background:#fff4e5;color:#b45309;font-size:13px;font-weight:700}
.call{display:inline-block;margin:2px 0 0;padding:7px 12px;border-radius:10px;background:#e8f8ef;color:var(--gd);font-weight:800;font-size:15px;text-decoration:none}
#shopBar{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--bd)}
#shopBar button{flex:1;border:0;border-radius:10px;padding:10px 8px;font-size:14px;font-weight:800;color:#fff}
#shopToggle.open{background:var(--g)} #shopToggle.closed{background:var(--red)}
#soldBtn{background:#6b7280}
#soldModal{position:fixed;inset:0;background:#fff;z-index:55;display:none;flex-direction:column}
#soldModal.show{display:flex}
#soldModal .sh{background:var(--g);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#soldModal .sh h2{margin:0;font-size:18px;flex:1}
#soldModal .sh button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
#soldSearch{margin:10px 12px 0;padding:11px;border:1px solid var(--bd);border-radius:10px;font-size:16px}
#soldList{flex:1;overflow:auto;padding:8px 12px 30px}
.day{position:sticky;top:96px;z-index:5;display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--bg);padding:12px 2px 8px;font-weight:800}
.day small{font-weight:600;color:var(--mut);font-size:13px}
.sc{font-weight:800;margin:14px 0 4px;color:var(--gd)}
.sr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.sr .nm{flex:1;font-size:15px}
.sr.out .nm{color:var(--red);font-weight:700}
.sr input[type=time]{padding:6px;border:1px solid var(--bd);border-radius:8px;font-size:14px}
.sr .tg{border:0;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;color:#fff;background:var(--g);min-width:64px}
.sr.out .tg{background:var(--red)}
#snd{display:none;background:#fff3cd;padding:10px 16px;font-size:14px;text-align:center}
</style>
</head>
<body>
<div id="login" style="display:none">
  <h2>Long Do Bar</h2>
  <div style="color:var(--mut);font-size:14px">เข้าสู่ระบบสำหรับพนักงาน</div>
  <input id="em" type="text" placeholder="ชื่อผู้ใช้ (username)" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
  <input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
  <div id="err"></div>
  <button class="btn big" id="loginBtn" style="width:100%">เข้าสู่ระบบ</button>
</div>

<div id="app" style="display:none">
  <header>
    <span class="dot" id="dot" title="สถานะเชื่อมต่อ"></span>
    <h1>Long Do Bar</h1>
    <button id="lineBtn">📲 รับแจ้งเตือน LINE</button>
    <button id="muteBtn">🔔 เสียง: เปิด</button>
    <button id="outBtn">ออก</button>
  </header>
  <div id="snd" style="cursor:pointer;font-weight:700">🔇 เสียงยังไม่เปิด — แตะตรงนี้ 1 ครั้งเพื่อเปิดเสียงแจ้งเตือน</div>
  <div id="shopBar">
    <button id="shopToggle" class="open">🟢 เปิดรับออเดอร์</button>
    <button id="soldBtn">🍽 เมนูหมด</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <main id="list"></main>
</div>

<div id="soldModal">
  <div class="sh"><h2>จัดการเมนูหมด</h2><button id="soldClose">ปิด</button></div>
  <input id="soldSearch" type="search" placeholder="ค้นหาเมนู...">
  <div id="soldList"></div>
</div>
<div id="popup"><div><h2>🔔 มีออเดอร์ใหม่!</h2><p id="popTxt"></p><button class="btn big" id="popOk">รับทราบ</button></div></div>

<script>
const SUPABASE_URL = "https://hidijpovftoklydqhxvr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpZGlqcG92ZnRva2x5ZHFoeHZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MDA1MTEsImV4cCI6MjEwMDI3NjUxMX0.2pl2kgTWKtERJa-otzvw8IcHsSKaAUOok8ZvhXOusKA";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TABS = [
  {k:"new", t:"ออเดอร์ใหม่"},
  {k:"preparing", t:"กำลังทำ"},
  {k:"done", t:"เสร็จสมบูรณ์"}
];
const NEXT = { new:{to:"preparing", label:"รับออเดอร์"} };
const normStatus = st => st === "ready" ? "preparing" : st; // สถานะเก่า "พร้อม" นับเป็นกำลังทำ
let orders = new Map();
let curTab = "new";
let muted = false;
let alarmTimer = null;
let audioCtx = null;
let channel = null;
let pollTimer = null;
const fresh = new Set();

function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const $ = id => document.getElementById(id);
const fmt = n => "฿" + Number(n||0).toLocaleString("th-TH");

/* ---------- sound ---------- */
function audioOk(){ return !!audioCtx && audioCtx.state === "running"; }
function refreshSndBanner(){
  $("snd").style.display = (!muted && !audioOk() && $("app").style.display !== "none") ? "block" : "none";
}
function ensureAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state !== "running"){
      const r = audioCtx.resume();
      if(r && r.then) r.then(refreshSndBanner, refreshSndBanner);
    }
  }catch(e){}
  refreshSndBanner();
}
setInterval(refreshSndBanner, 1500);
function beep(){
  if(muted) return;
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  if(!audioCtx || audioCtx.state !== "running"){ ensureAudio(); if(!audioOk()) return; }
  try{
    [0, .25].forEach(d=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = d ? 1040 : 780;
      g.gain.setValueAtTime(.0001, audioCtx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(.5, audioCtx.currentTime + d + .02);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + d + .22);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + .25);
    });
  }catch(e){}
}
function updateAlarm(){
  const hasNew = [...orders.values()].some(o=>o.status==="new");
  if(hasNew && !alarmTimer){
    beep();
    alarmTimer = setInterval(beep, 4000);
  }else if(!hasNew && alarmTimer){
    clearInterval(alarmTimer); alarmTimer = null;
  }
  if(!hasNew) $("popup").classList.remove("show");
}
document.addEventListener("click", ()=>{ const was = audioOk(); ensureAudio(); if(!was && [...orders.values()].some(o=>o.status==="new")) setTimeout(beep,100); });
document.addEventListener("touchstart", ensureAudio, {passive:true});
$("muteBtn").onclick = ()=>{
  muted = !muted;
  $("muteBtn").textContent = muted ? "🔕 เสียง: ปิด" : "🔔 เสียง: เปิด";
  if(!muted){ ensureAudio(); setTimeout(beep, 50); } // กดเปิดเสียงแล้วลองดังให้ฟัง
  refreshSndBanner();
};
$("popOk").onclick = ()=> $("popup").classList.remove("show");

/* ---------- render ---------- */
function phoneOf(t){
  const m = String(t || "").match(/0\d[\d\s-]{7,11}\d/);
  return m ? m[0].trim() : "";
}
function timeAgo(iso){
  const m = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/60000));
  if(m < 1) return "เมื่อสักครู่";
  if(m < 60) return m + " นาทีที่แล้ว";
  return new Date(iso).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}) + " น.";
}
function daysAgoStart(n){ const d = new Date(); d.setDate(d.getDate()-n); d.setHours(0,0,0,0); return d.getTime(); }
function dayKey(iso){ const d = new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayLabel(key){
  const t = dayKey(new Date().toISOString());
  const y = new Date(); y.setDate(y.getDate()-1);
  if(key === t) return "วันนี้";
  if(key === dayKey(y.toISOString())) return "เมื่อวาน";
  const [Y,M,D] = key.split("-").map(Number);
  return new Date(Y,M-1,D).toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
}
function todayStart(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function visible(o){
  if(curTab === "done") return (o.status==="done"||o.status==="cancelled") && new Date(o.created_at).getTime() >= daysAgoStart(30);
  return normStatus(o.status) === curTab;
}
function render(){
  const all = [...orders.values()];
  $("tabs").innerHTML = TABS.map(t=>{
    const n = all.filter(o=> t.k==="done"
      ? (o.status==="done"||o.status==="cancelled") && new Date(o.created_at).getTime() >= todayStart()
      : normStatus(o.status)===t.k).length;
    return `<button class="tab ${t.k} ${t.k===curTab?"act":""}" data-k="${t.k}">${t.t}<span class="n ${n&&t.k==="new"?"has":""}">${n}</span></button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(b=> b.onclick = ()=>{ curTab = b.dataset.k; render(); });

  const list = all.filter(visible).sort((a,b)=>
    curTab==="done" ? new Date(b.created_at)-new Date(a.created_at) : new Date(a.created_at)-new Date(b.created_at));
  if(!list.length){ $("list").innerHTML = `<div class="empty">ไม่มีออเดอร์</div>`; return; }

  const cardHtml = o=>{
    const items = Array.isArray(o.items) ? o.items : [];
    const nx = NEXT[o.status];
    const type = esc(o.order_type);
    return `<div class="card ${fresh.has(o.id)?"fresh":""}" data-id="${esc(o.id)}">
      <div class="ch"><span class="no">#${esc(o.order_no)}</span>
        <span class="badge b-${type}">${type}</span></div>
      <div class="meta">
        <div><b>${esc(o.customer_name)}</b> · ${esc(timeAgo(o.created_at))}</div>
        <div>เวลา: <b>${esc(o.time_text)}</b></div>
        ${o.address ? `<div>ที่อยู่: ${esc(o.address)}</div>` : ""}
        ${o.note ? `<div>หมายเหตุ/เบอร์: <b>${esc(o.note)}</b></div>` : ""}
        ${phoneOf(o.note) ? `<a class="call" href="tel:${esc(phoneOf(o.note).replace(/\D/g,""))}">📞 โทร ${esc(phoneOf(o.note))}</a>` : ""}
        ${o.status==="cancelled" ? `<div style="color:var(--red);font-weight:700">ยกเลิกแล้ว</div>` : ""}
      </div>
      ${(!o.line_user_id && o.status!=="cancelled") ? `<div class="warn">⚠️ ไม่มี LINE ลูกค้า — ระบบแจ้งอัตโนมัติไม่ได้ ติดต่อลูกค้าทางเบอร์โทร</div>` : ""}
      <div class="items">${items.map(it=>`
        <div class="it"><div class="q">${esc(it.qty)}x</div><div>
          <div class="nm">${esc(it.name)}</div>
          ${(it.opts||[]).map(x=>`<div class="op">• ${esc(x)}</div>`).join("")}
          ${it.note ? `<div class="nt">📝 ${esc(it.note)}</div>` : ""}
        </div></div>`).join("")}</div>
      <div class="cf"><div class="tot">รวม ${esc(fmt(o.total))}</div>
        ${o.status==="done" && o.notified_at ? `<span style="color:var(--g);font-size:13px">✓ แจ้งลูกค้าแล้ว</span>` : ""}
        ${(o.status==="new"||normStatus(o.status)==="preparing") ? `<button class="btn sec" data-act="cancel">ยกเลิก</button>` : ""}
        ${nx && o.status==="new" ? `<button class="btn" data-act="next">${nx.label}</button>` : ""}
      </div>
      ${normStatus(o.status)==="preparing" ? `<div class="cf" style="border-top:0;padding-top:0">
        <button class="btn" style="flex:1" data-act="done-notify">เสร็จ (แจ้งลูกค้า)</button>
        <button class="btn" style="flex:1;background:#6b7280" data-act="done-silent">เสร็จ (ไม่แจ้ง)</button>
      </div>` : ""}</div>`;
  };
  if(curTab === "done"){
    const groups = {};
    list.forEach(o=>{ (groups[dayKey(o.created_at)] = groups[dayKey(o.created_at)] || []).push(o); });
    $("list").innerHTML = Object.keys(groups).sort().reverse().map(k=>{
      const g = groups[k], ok = g.filter(o=>o.status==="done");
      const sum = ok.reduce((t,o)=> t + Number(o.total||0), 0);
      return `<div class="day"><span>${esc(dayLabel(k))}</span><small>${ok.length} ออเดอร์ · ${esc(fmt(sum))}${g.length-ok.length ? ` · ยกเลิก ${g.length-ok.length}` : ""}</small></div>` + g.map(cardHtml).join("");
    }).join("");
  }else{
    $("list").innerHTML = list.map(cardHtml).join("");
  }

  document.querySelectorAll(".card").forEach(c=>{
    const id = c.dataset.id;
    const nb = c.querySelector('[data-act="next"]');
    const cb = c.querySelector('[data-act="cancel"]');
    if(nb) nb.onclick = ()=> setStatus(id, NEXT[orders.get(id).status].to);
    if(cb) cb.onclick = ()=>{ if(confirm("ยืนยันยกเลิกออเดอร์นี้?")) setStatus(id, "cancelled"); };
    const dn = c.querySelector('[data-act="done-notify"]');
    const ds = c.querySelector('[data-act="done-silent"]');
    if(dn) dn.onclick = ()=> finishOrder(id, true);
    if(ds) ds.onclick = ()=> finishOrder(id, false);
  });
}

function toast(msg){
  let t = $("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;max-width:90vw;text-align:center;font-size:14px";
    document.body.appendChild(t); }
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.style.display = "none", 4000);
}
async function finishOrder(id, notify){
  const o = orders.get(id); if(!o) return;
  if(notify && !o.line_user_id){
    if(!confirm("ออเดอร์นี้ไม่มีข้อมูล LINE ของลูกค้า จึงแจ้งอัตโนมัติไม่ได้\nต้องการกดเสร็จ (ไม่แจ้ง) แทนหรือไม่?")) return;
    notify = false;
  }
  await setStatus(id, "done");
  if(!notify || orders.get(id).status !== "done") return;
  const { data, error } = await sb.functions.invoke("swift-endpoint", { body: { order_id: id } });
  let detail = (data && data.error) || "";
  if(error && !detail){
    detail = error.message || "unknown";
    try{ // ฟังก์ชันตอบ non-2xx: อ่านเนื้อหาจริงที่ฟังก์ชันส่งกลับ
      if(error.context && error.context.json){ const j = await error.context.json(); detail = (j && (j.error || j.message)) || detail; }
      else if(error.context && error.context.status){ detail += " (HTTP " + error.context.status + ")"; }
    }catch(e){}
    if(/Failed to send a request/i.test(detail)) detail += " — ฟังก์ชันอาจยังไม่ได้ deploy หรือชื่อไม่ใช่ notify-line";
  }
  if(detail){
    console.error("notify-line failed:", error, data);
    toast("เสร็จแล้ว แต่ส่งข้อความหาลูกค้าไม่สำเร็จ: " + detail);
    alert("แจ้งลูกค้าไม่สำเร็จ\n" + detail);
  }else{
    o.notified_at = new Date().toISOString(); render();
    toast("ส่งข้อความแจ้งลูกค้าแล้ว ✓");
  }
}
async function setStatus(id, status){
  const o = orders.get(id); if(!o) return;
  const prev = o.status;
  o.status = status; fresh.delete(id); render(); updateAlarm();
  const { error } = await sb.from("orders").update({status, updated_at:new Date().toISOString()}).eq("id", id);
  if(error){ o.status = prev; render(); updateAlarm(); alert("บันทึกไม่สำเร็จ: " + error.message); }
}

/* ---------- data ---------- */
function upsertOrder(o, announce){
  const isNew = !orders.has(o.id);
  orders.set(o.id, o);
  if(isNew && o.status === "new" && announce){
    fresh.add(o.id);
    $("popTxt").textContent = `#${o.order_no} · ${o.customer_name}`;
    $("popup").classList.add("show");
    ensureAudio();
  }
}
let fullLoaded = false;
async function loadOrders(announce){
  const since = new Date(daysAgoStart(fullLoaded ? 1 : 30)); // ครั้งแรกโหลดย้อนหลัง 30 วัน รอบถัดไปโหลดเฉพาะล่าสุด
  const { data, error } = await sb.from("orders").select("*")
    .or(`status.in.(new,preparing,ready),created_at.gte.${since.toISOString()}`)
    .order("created_at",{ascending:true}).limit(2000);
  if(error){ $("dot").classList.remove("on"); return; }
  fullLoaded = true;
  const ids = new Set(data.map(o=>o.id));
  data.forEach(o=> upsertOrder(o, announce));
  for(const id of [...orders.keys()]) if(!ids.has(id) && orders.get(id).status==="new") orders.delete(id);
  render(); updateAlarm();
}
function startRealtime(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("orders-bar")
    .on("postgres_changes",{event:"*",schema:"public",table:"orders"}, p=>{
      if(p.eventType === "DELETE"){ orders.delete(p.old.id); }
      else upsertOrder(p.new, true);
      render(); updateAlarm();
    })
    .subscribe(st=>{
      $("dot").classList.toggle("on", st === "SUBSCRIBED");
      if(st === "SUBSCRIBED") loadOrders(true);
    });
  clearInterval(pollTimer);
  pollTimer = setInterval(()=> loadOrders(true), 15000); // สำรองกรณี realtime หลุด
  setInterval(render, 60000);
}

/* ---------- เปิด/ปิดรับออเดอร์ ---------- */
let shopOpen = true;
function renderShop(){
  const b = $("shopToggle");
  b.className = shopOpen ? "open" : "closed";
  b.textContent = shopOpen ? "🟢 เปิดรับออเดอร์ (แตะเพื่อปิด)" : "🔴 ปิดรับออเดอร์ (แตะเพื่อเปิด)";
}
async function loadShop(){
  const { data } = await sb.from("shop_settings").select("*").eq("key","ordering").maybeSingle();
  if(data && data.value) shopOpen = data.value.open !== false;
  renderShop();
}
$("shopToggle").onclick = async ()=>{
  const next = !shopOpen;
  if(!confirm(next ? "เปิดรับออเดอร์อีกครั้ง?" : "ปิดรับออเดอร์ชั่วคราว?\nลูกค้าจะสั่งผ่านหน้าเว็บไม่ได้จนกว่าจะเปิดใหม่")) return;
  const { error } = await sb.from("shop_settings").upsert({ key:"ordering", value:{ open: next }, updated_at:new Date().toISOString() });
  if(error){ alert("บันทึกไม่สำเร็จ: " + error.message); return; }
  shopOpen = next; renderShop();
};

/* ---------- จัดการเมนูหมด ---------- */
let soldMap = {};   // item_id -> {until}
let menuRows = [];
function isOutNow(e){
  if(!e) return false;
  if(!e.until) return true;
  const [h,m] = e.until.split(":").map(Number);
  const d = new Date(); d.setHours(h,m,0,0);
  return new Date() < d;
}
async function openSold(){
  $("soldModal").classList.add("show");
  $("soldList").innerHTML = '<div class="empty">กำลังโหลด...</div>';
  const [m, so] = await Promise.all([
    sb.from("menu_items").select("id,name,category,subcategory,category_order,subcategory_order,sort_order"),
    sb.from("sold_out_items").select("*")
  ]);
  if(m.error || so.error){ $("soldList").innerHTML = '<div class="empty">โหลดไม่สำเร็จ: ' + esc((m.error||so.error).message) + '</div>'; return; }
  menuRows = m.data.sort((a,b)=>(a.category_order||0)-(b.category_order||0) || (a.subcategory_order||0)-(b.subcategory_order||0) || (a.sort_order||0)-(b.sort_order||0));
  soldMap = {}; so.data.forEach(r=> soldMap[r.item_id] = r.until ? { until: r.until } : {});
  renderSold();
}
function renderSold(){
  const q = $("soldSearch").value.trim().toLowerCase();
  let html = "", lastCat = "";
  menuRows.forEach(r=>{
    if(q && !String(r.name).toLowerCase().includes(q)) return;
    const cat = r.category + (r.subcategory ? " › " + r.subcategory : "");
    if(cat !== lastCat){ html += `<div class="sc">${esc(cat)}</div>`; lastCat = cat; }
    const e = soldMap[r.id], out = !!e;
    html += `<div class="sr ${out?"out":""}" data-id="${esc(r.id)}">
      <div class="nm">${esc(r.name)}</div>
      ${out ? `<input type="time" value="${esc(e.until||"")}" title="เวลากลับมาขาย (เว้นว่าง = หมดจนกว่าจะปิด)">` : ""}
      <button class="tg" type="button">${out ? "หมดอยู่" : "ปกติ"}</button></div>`;
  });
  $("soldList").innerHTML = html || '<div class="empty">ไม่พบเมนู</div>';
  document.querySelectorAll("#soldList .sr").forEach(row=>{
    const id = row.dataset.id;
    row.querySelector(".tg").onclick = ()=> setSold(id, !soldMap[id], "");
    const t = row.querySelector('input[type=time]');
    if(t) t.onchange = ()=> setSold(id, true, t.value);
  });
}
async function setSold(id, out, until){
  const prev = soldMap[id];
  if(out) soldMap[id] = until ? { until } : {}; else delete soldMap[id];
  renderSold();
  const res = out
    ? await sb.from("sold_out_items").upsert({ item_id:id, until: until || null, updated_at:new Date().toISOString() })
    : await sb.from("sold_out_items").delete().eq("item_id", id);
  if(res.error){
    if(prev) soldMap[id] = prev; else delete soldMap[id];
    renderSold(); alert("บันทึกไม่สำเร็จ: " + res.error.message);
  }
}
$("soldBtn").onclick = openSold;
$("soldClose").onclick = ()=> $("soldModal").classList.remove("show");
$("soldSearch").oninput = renderSold;

/* ---------- ลงทะเบียนรับแจ้งเตือนออเดอร์ใหม่ทาง LINE ---------- */
const LIFF_ID = "2012450565-H3r4TizT";
let liffReady = null;
function loadLiff(){
  if(liffReady) return liffReady;
  liffReady = new Promise((ok, no)=>{
    const sc = document.createElement("script");
    sc.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
    sc.onload = ()=> window.liff.init({ liffId: LIFF_ID }).then(ok, no);
    sc.onerror = no;
    document.head.appendChild(sc);
  });
  return liffReady;
}
function isStandalone(){
  return !!(window.navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches));
}
function showLineHelp(){
  const link = `https://liff.line.me/${LIFF_ID}/bar.html?register=1`;
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px";
  ov.innerHTML = '<div style="background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%;font-size:15px;line-height:1.55">'
    + '<div style="font-weight:800;font-size:17px;margin-bottom:8px">ลงทะเบียนรับแจ้งเตือน LINE</div>'
    + 'แอปที่ติดตั้งไว้ล็อกอิน LINE โดยตรงไม่ได้ (ข้อจำกัดของ iPhone) ให้ทำครั้งเดียวผ่านแอป LINE:<ol style="padding-left:20px;margin:8px 0">'
    + '<li>กด "คัดลอก/แชร์ลิงก์" ด้านล่าง</li><li>วางลิงก์ในแชท LINE (เช่น Keep ของตัวเอง) แล้วกดเปิด</li>'
    + '<li>ล็อกอินหลังบาร์ในหน้าที่เปิดขึ้นมา ระบบจะลงทะเบียนให้เอง</li></ol>'
    + '<input readonly style="width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;font-size:13px" value="' + link + '">'
    + '<div style="display:flex;gap:8px;margin-top:12px"><button id="lhShare" style="flex:1;border:0;border-radius:10px;padding:11px;font-weight:800;color:#fff;background:#00b14f">คัดลอก/แชร์ลิงก์</button>'
    + '<button id="lhClose" style="flex:1;border:0;border-radius:10px;padding:11px;font-weight:800;background:#eee">ปิด</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#lhClose").onclick = ()=> ov.remove();
  ov.querySelector("#lhShare").onclick = async ()=>{
    try{
      if(navigator.share){ await navigator.share({ url: link }); }
      else { await navigator.clipboard.writeText(link); toast("คัดลอกลิงก์แล้ว"); }
    }catch(e){ try{ await navigator.clipboard.writeText(link); toast("คัดลอกลิงก์แล้ว"); }catch(_){} }
  };
}
async function registerLine(auto){
  try{
    if(!auto && isStandalone()){
      let inClient = false;
      try{ await loadLiff(); inClient = liff.isInClient(); }catch(e){}
      if(!inClient){ showLineHelp(); return; }
    }
    await loadLiff();
    if(!liff.isLoggedIn()){
      if(auto) return;
      try{ localStorage.setItem("bar_want_line","1"); }catch(e){}
      liff.login({ redirectUri: location.href.split("#")[0].split("?")[0] });
      return;
    }
    const p = await liff.getProfile();
    const { error } = await sb.from("staff_line").upsert({ user_id: p.userId, display_name: p.displayName });
    if(error) throw error;
    try{ localStorage.removeItem("bar_want_line"); localStorage.setItem("bar_line_ok","1"); }catch(e){}
    $("lineBtn").textContent = "✓ LINE: " + p.displayName;
    if(!auto) toast("ลงทะเบียนรับแจ้งเตือนทาง LINE แล้ว");
  }catch(e){
    if(!auto) alert("ลงทะเบียน LINE ไม่สำเร็จ: " + (e && e.message || e));
  }
}
$("lineBtn").onclick = ()=> registerLine(false);
function autoLine(){
  try{ if(/[?&]register=1/.test(location.search)) localStorage.setItem("bar_want_line","1"); }catch(e){}
  let want = false, ok = false;
  try{ want = localStorage.getItem("bar_want_line")==="1"; ok = localStorage.getItem("bar_line_ok")==="1"; }catch(e){}
  if(want || ok) registerLine(true);
}

/* ---------- PWA: service worker + กันจอดับ ---------- */
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
let wakeLock = null;
async function keepAwake(){
  try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible" && $("app").style.display !== "none") keepAwake(); });

/* ---------- auth ---------- */
function showApp(){
  $("login").style.display = "none"; $("app").style.display = "block";
  loadOrders(false).then(startRealtime);
  loadShop();
  sb.channel("shop-bar").on("postgres_changes",{event:"*",schema:"public",table:"shop_settings"}, loadShop).subscribe();
  keepAwake();
  autoLine();
}
function showLogin(){
  $("app").style.display = "none"; $("login").style.display = "block";
  clearInterval(pollTimer); clearInterval(alarmTimer); alarmTimer = null;
}
const EMAIL_DOMAIN = "@longdocafe.com"; // Supabase ต้องใช้รูปแบบอีเมล: username "bar" => bar@longdocafe.com
const COOKIE_DAYS = 90;
function setCookie(n,v,days){ document.cookie = `${n}=${encodeURIComponent(v)}; max-age=${days*86400}; path=/; SameSite=Lax`; }
function getCookie(n){ const m = document.cookie.split("; ").find(x=>x.startsWith(n+"=")); return m ? decodeURIComponent(m.slice(n.length+1)) : ""; }
function delCookie(n){ document.cookie = `${n}=; max-age=0; path=/`; }
$("loginBtn").onclick = async ()=>{
  $("err").textContent = "";
  const u = $("em").value.trim().toLowerCase();
  if(!u){ $("err").textContent = "กรุณากรอกชื่อผู้ใช้"; return; }
  const email = u.includes("@") ? u : u + EMAIL_DOMAIN;
  const { error } = await sb.auth.signInWithPassword({email, password:$("pw").value});
  if(error){ $("err").textContent = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"; return; }
  setCookie("bar_username", u, COOKIE_DAYS);
  setCookie("bar_login", "1", COOKIE_DAYS); // หมดอายุ 90 วัน => ต้องล็อกอินใหม่
  ensureAudio(); showApp();
};
$("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") $("loginBtn").click(); });
$("outBtn").onclick = async ()=>{ delCookie("bar_login"); await sb.auth.signOut(); orders.clear(); showLogin(); };
(async ()=>{
  $("em").value = getCookie("bar_username");
  const { data } = await sb.auth.getSession();
  if(data && data.session && getCookie("bar_login") === "1") showApp();
  else { if(data && data.session) await sb.auth.signOut(); showLogin(); }
})();
</script>
